[experiment]
treatment      = "T-D"
description    = "IR + Few-Shot + Grounding — IntentIR 형식, 정적 5개 데모, 토폴로지 인벤토리 주입"
output_format  = "intent_ir"
few_shot       = true
grounding      = true
dataset_path   = "research/experiments/eval/data/gold350_eval.jsonl"
topology_path  = "research/experiments/eval/data/topology_eval.json"
demos_path     = "research/experiments/eval/data/demonstrations.json"

[llm]
model          = "gemini-3.1-flash-lite"
temperature    = 0.2
max_tokens     = 1024
timeout_s      = 30.0
retries        = 2
