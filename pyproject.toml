[project]
name = "sdn-xai-pipeline"
version = "0.1.0"
description = "Natural language intent to ONOS FlowRule pipeline with LLM/RAG parsing, digital twin validation, XAI explanation, and ONOS deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.128,<1",
    "uvicorn[standard]>=0.40,<1",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2,<2",
    # RAG
    "faiss-cpu>=1.14,<2",
    "numpy>=2.2,<3",
    "pandas>=2.3,<3",
    # LLM backend (Gemini / OpenRouter)
    "google-genai>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]
# Only needed by scripts/make_exp1_pptx.py
reports = ["python-pptx>=1.0,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# project name normalizes to "sdn_xai_pipeline", which doesn't match the
# import name we actually want ("xai_pipeline") — so autodetection can't
# find it and this must be explicit.
packages = ["src/xai_pipeline"]

[project.scripts]
xai-pipeline = "xai_pipeline.main:main"
xai-pipeline-evaluate = "xai_pipeline.evaluate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
